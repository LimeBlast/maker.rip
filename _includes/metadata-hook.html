{% if jekyll.environment == 'production' %}
  <!-- Umami (self-hosted). Renamed tracker, so not Chirpy's built-in analytics.umami, which loads /script.js -->
  <script defer src="https://pythia.limeblast.co.uk/omen.js" data-website-id="f561cad4-2ab3-4940-b5ef-01f5f0035563"></script>
{% endif %}

<!-- Feed autodiscovery: Chirpy doesn't advertise its own feed -->
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">

<!-- Sidebar logo: Chirpy crops the avatar to a circle, the Maker.RIP sticker is landscape, so let it be its own shape -->
<style>
  #avatar { width: 100% !important; height: auto !important; border-radius: 0 !important; box-shadow: none !important; }
  #avatar img { width: 100%; height: auto; }
  #avatar img { transition: none; }
  #avatar img:hover { transform: none !important; }
  #sidebar .site-subtitle { display: none; } /* tagline is empty, but Chirpy reserves 3rem for it */
  #access-lastmod { display: none; } /* Recently Updated duplicates the homepage list; no lastmod plugin */
  #panel-wrapper .access > section:has(.post-tag) { display: none; } /* Trending Tags is just the 10 most-used tags, ties alphabetical */
  /* Post photos fill the column by default; cap their height (lightbox still opens full size) */
  .content a.popup img { max-height: 24rem; width: auto; }
  /* Images on consecutive lines (one paragraph) sit side by side as a wrapping gallery */
  .content p:has(> a.popup ~ a.popup):not(:has(> em)) { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; }
  .content p:has(> a.popup ~ a.popup):not(:has(> em)) > a.popup { margin: 0; left: auto; transform: none; } /* undo Chirpy's single-image centring */
  .content p:has(> a.popup ~ a.popup):not(:has(> em)) img { height: 14rem; width: auto; }
  /* Captioned galleries: photos fill row 1 and each caption drops into row 2 under its own photo, one column per photo */
  @media (min-width: 576px) {
    .content p:has(> a.popup ~ a.popup):has(> em) { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; grid-template-rows: auto auto; column-gap: 0.5rem; row-gap: 0; align-items: start; }
    .content p:has(> a.popup ~ a.popup):has(> em) > a.popup { grid-row: 1; justify-self: center; margin: 0; left: auto; transform: none; }
    .content p:has(> a.popup ~ a.popup):has(> em) > em { grid-row: 2; }
    .content p:has(> a.popup ~ a.popup):has(> em) img { height: auto; max-height: 14rem; max-width: 100%; }
  }
</style>

<!-- Categories page: Chirpy draws a disabled chevron on categories with no subcategories (none here have any) -->
<style>
  .category-trigger.disabled { display: none; }
</style>

<!-- Random Post and Random Photo (assets/random.json) at the top of the side panel. Panel only shows at xl (1200px), so wait until it does before fetching -->
<style>
  #panel-wrapper .access-random a { color: inherit; border-bottom: none; } /* beats Chirpy's .content a underline */
  #panel-wrapper .access-random a:hover { color: var(--link-color); }
  .access-random img { display: block; width: auto; height: auto; max-width: calc(100% - 1rem); max-height: 20rem; border-radius: 0.5rem; margin: 1rem 0 0.5rem; }
  .access-random .content { margin: 0 1rem 0 0; }
  .access-random h2 + .content { margin-top: 0.75rem; } /* post with neither header image nor description */
  .access-random blockquote { margin: 1rem 1rem 0.5rem 0; padding: 0.6rem 0.9rem; border-left: 3px solid var(--link-color); border-radius: 0 0.5rem 0.5rem 0; background: rgba(127, 127, 127, 0.08); font-size: 0.95rem; font-style: italic; line-height: 1.45; }
</style>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var access = document.querySelector('#panel-wrapper .access');
    var xl = window.matchMedia('(min-width: 1200px)');
    if (!access) return;
    if (xl.matches) addRandom(access);
    else xl.addEventListener('change', function wait(e) {
      if (!e.matches) return;
      xl.removeEventListener('change', wait);
      addRandom(access);
    });
  });
  function addRandom(access) {
    fetch('{{ "/assets/random.json" | relative_url }}')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var post = pick(data.posts, [location.pathname]);
        var photo = pick(data.photos, [location.pathname, post && post.url]);
        var after = document.getElementById('access-lastmod');
        [['access-post', 'Random Post', post], ['access-photo', 'Random Photo', photo]].forEach(function (b) {
          if (!b[2]) return;
          var section = document.createElement('section');
          section.id = b[0];
          section.className = 'access-random';
          // src, alt, title and desc arrive HTML-escaped from the build, so they go straight into markup
          section.innerHTML = '<h2 class="panel-heading">' + b[1] + '</h2>' +
            (b[2].src ? '<a href="' + b[2].url + '"><img src="' + b[2].src + '" alt="' + b[2].alt + '" loading="lazy"></a>'
              : b[2].desc ? '<a href="' + b[2].url + '"><blockquote>' + b[2].desc + '</blockquote></a>' : '') +
            '<div class="content"><a href="' + b[2].url + '">' + b[2].title + '</a></div>';
          access.insertBefore(section, after ? after.nextSibling : access.firstChild);
          after = section;
        });
      })
      .catch(function () {});
  }
  function pick(list, skipUrls) {
    list = list.filter(function (x) { return skipUrls.indexOf(x.url) < 0; });
    return list[Math.floor(Math.random() * list.length)];
  }
</script>

<!-- Click-to-load embeds (_includes/click-to-load.html): swap the poster for the iframe on click -->
<style>
  .click-to-load { position: relative; margin: 0 0 1rem; }
  .click-to-load > a { position: relative; display: block; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: #000; }
  .click-to-load > a img { width: 100%; height: 100%; object-fit: cover; margin: 0 !important; border-radius: 0 !important; }
  .click-to-load > a::before { content: ""; position: absolute; z-index: 1; inset: 50% auto auto 50%; width: 68px; height: 48px; translate: -50% -50%; border-radius: 12px; background: rgba(33, 33, 33, 0.8); transition: background 0.15s; }
  .click-to-load > a::after { content: ""; position: absolute; z-index: 2; inset: 50% auto auto 50%; translate: -35% -50%; border-style: solid; border-width: 10px 0 10px 18px; border-color: transparent transparent transparent #fff; }
  .click-to-load > a:hover::before, .click-to-load > a:focus-visible::before { background: #e53935; }
  .click-to-load figcaption { margin-top: 0.4rem; text-align: center; font-size: 80%; color: var(--text-muted-color, #6d6c6c); }
</style>
<script>
  document.addEventListener('click', function (e) {
    var link = e.target.closest('a[data-embed-src]');
    if (!link) return;
    e.preventDefault();
    var frame = document.createElement('iframe');
    frame.className = 'embed-video';
    frame.src = link.dataset.embedSrc;
    frame.title = link.dataset.embedTitle;
    frame.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
    frame.allowFullscreen = true;
    frame.style.marginBottom = '0';
    link.replaceWith(frame);
    frame.focus();
  });
</script>
